services:
  postgres:
    image: postgres:17
    container_name: loganalyzer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/02-init.sql

  redis:
    image: redis:7
    container_name: loganalyzer-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

  backend:
    build:
      context: ./backend
    container_name: loganalyzer-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      - postgres

  generator:
    build:
      context: ./generator
    container_name: loganalyzer-generator
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_STREAM: logs

    depends_on:
      - redis

  processor:
    build:
      context: ./processor
    container_name: loganalyzer-processor
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: